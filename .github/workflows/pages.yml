name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build       # library bundle -> dist/
      - run: npm run build:demo  # demo site -> dist-demo/
      # Self-host the library bundle alongside the demo so it can be loaded via
      # a <script> tag straight from Pages (no npm needed). ES-only since the
      # battle-mat split: every entry plus the lazy/shared battle-mat chunks
      # (a glob, so new entries like battle-toolbar.js ride along).
      - run: cp dist/*.js dist-demo/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
